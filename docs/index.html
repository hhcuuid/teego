<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock screener | TeeGo</title>
    <link rel="icon" type="image/svg+xml" href="cactus.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/css/tabulator.min.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="page">
        <header class="page-header">
            <div>
                <h1>US Common Stock screener</h1>
            </div>
            <label class="search">
                <input id="stock-search" type="search" placeholder="Ticker, company, industry…" autocomplete="off" />
            </label>
        </header>

        <section class="table-panel" aria-label="Stock data">
            <div id="stock-table"></div>
            <p id="table-error" class="table-error" role="alert" hidden></p>
        </section>

        <section id="ticker-detail" class="ticker-detail" aria-label="Ticker data" hidden>
            <div class="ticker-detail-heading">
                <p id="ticker-meta" class="ticker-meta"></p>
                <h2 id="ticker-name"></h2>
            </div>
            <p id="ticker-error" class="table-error" role="alert" hidden></p>
            <div class="metric-toolbar">
                <label class="metric-search">
                    <input id="metric-search" type="search" placeholder="Search metrics…" aria-label="Search metrics" />
                </label>
                <p id="metric-summary" class="metric-summary" aria-live="polite"></p>
            </div>
            <section class="metric-section" aria-labelledby="annual-title">
                <div class="metric-section-heading">
                    <h3 id="annual-title">Annual</h3>
                    <p>Year-end observations</p>
                    <span id="annual-count"></span>
                </div>
                <div class="metric-grid" id="annual-grid"></div>
                <p class="metric-empty" id="annual-empty">No annual metrics match your search.</p>
            </section>
            <section class="metric-section" aria-labelledby="quarterly-title">
                <div class="metric-section-heading">
                    <h3 id="quarterly-title">Quarterly</h3>
                    <p>Quarter-end observations</p>
                    <span id="quarterly-count"></span>
                </div>
                <div class="metric-grid" id="quarterly-grid"></div>
                <p class="metric-empty" id="quarterly-empty">No quarterly metrics match your search.</p>
            </section>
            <p class="metric-footnote">Metrics without numeric observations are omitted. Hover a bar to see its exact
                period and value.</p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
